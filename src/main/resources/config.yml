# Tool Mechanics Settings
mechanics:
  drill:
    # Pattern type: 3X3 or CROSS
    pattern: "3X3"
    # Cooldown in milliseconds between tool triggers
    cooldown-ms: 300
    # List of blocks the Drill will NOT break
    blacklist:
      - DIRT
      - GRASS_BLOCK
      - SAND
      - GRAVEL
      - BEDROCK
      - CHEST
      - BARREL
      - SHULKER_BOX

  tree_chopper:
    # Max blocks the Tree Chopper will scan per activation (prevents lag / infinite recursion)
    max-blocks: 1000
    # List of blocks the Tree Chopper will NOT break
    blacklist:
      - STONE
      - COBBLESTONE
      - DIRT
      - GRASS_BLOCK
      - BEDROCK

  # Multi-tool switches between Drill (for ores/stone) and Tree Chopper (for logs).
  # It inherits the drill & tree_chopper settings above.
  multi_tool:
    # Cooldown in milliseconds
    cooldown-ms: 300

# World Blacklist: worlds where custom tools are disabled
world-blacklist:
  - world_spawn
  - lobby

# Auto-collect: when true, broken blocks are placed directly into the player's
# inventory. If the inventory is full, items drop on the ground as usual.
auto-collect: true

# Folia / Anti-Lag Performance
performance:
  # Blocks to process per tick in the batch scheduler
  batch-size: 15

# Auto-collect: automatically pick up broken blocks into the player's inventory.
# If inventory is full, items drop naturally (vanilla behavior).
# When the player is sneaking (shift), ALL custom mechanics are cancelled
# and the block breaks normally (vanilla behavior).
drops:
  # Suppress drops entirely (block becomes AIR, drops nothing)
  suppress-list:
    - STONE
    - DIORITE
    - GRANITE
    - ANDESITE
    - DIRT
    - COBBLESTONE
    - DEEPSLATE
    - COBBLED_DEEPSLATE

  # Custom drop overrides: override what the block drops when broken by a HqngTools tool
  custom-overrides:
    IRON_ORE:
      material: IRON_INGOT
      amount: 1
    DEEPSLATE_IRON_ORE:
      material: IRON_INGOT
      amount: 1
    GOLD_ORE:
      material: GOLD_INGOT
      amount: 1
    DEEPSLATE_GOLD_ORE:
      material: GOLD_INGOT
      amount: 1
    COPPER_ORE:
      material: COPPER_INGOT
      amount: 1
    DEEPSLATE_COPPER_ORE:
      material: COPPER_INGOT
      amount: 1

# Item definitions used by /htools give and createTool()
# name/lore: MiniMessage format
# enchants: list of "enchant_name:level" (Minecraft namespaced ID without minecraft:)
# glow: adds enchantment glint even without enchants
items:
  drill:
    name: "<dark_red>ᴅʀɪʟʟ"
    material: NETHERITE_PICKAXE
    glow: true
    enchants:
      - "efficiency:5"
      - "unbreaking:3"
      - "fortune:3"
    lore:
      - "<dark_gray>Công cụ khai thác hạng nặng"
      - ""
      - "<gray>Tính năng:"
      - "<red>• Phá hủy khối 3x3 hoặc hình chữ thập"
      - "<red>• Tự động nung quặng sắt/vàng/đồng"
      - "<red>• Lọc bỏ đá, đất, cuội để tránh lag"

  tree_chopper:
    name: "<dark_red>ᴛʀᴇᴇ ᴄʜᴏᴘᴘᴇʀ"
    material: NETHERITE_AXE
    glow: true
    enchants:
      - "efficiency:5"
      - "unbreaking:3"
    lore:
      - "<dark_gray>Công cụ khai thác lâm nghiệp"
      - ""
      - "<gray>Tính năng:"
      - "<red>• Chặt toàn bộ cây chỉ với 1 lần đập"
      - "<red>• Tự động thu hoạch gỗ và lá liên quan"
      - "<red>• Cơ chế phá hủy theo cụm (Batch breaking)"

  multi_tool:
    name: "<dark_red>ᴍᴜʟᴛɪ-ᴛᴏᴏʟ"
    material: NETHERITE_PICKAXE
    glow: true
    enchants:
      - "efficiency:6"
      - "unbreaking:4"
      - "fortune:4"
    lore:
      - "<dark_gray>Siêu công cụ tối thượng"
      - ""
      - "<gray>Tính năng:"
      - "<red>• Đa chức năng: Tự động đổi chế độ"
      - "<red>• Hoạt động như Drill khi đào quặng/đá"
      - "<red>• Hoạt động như Tree Chopper khi chặt gỗ"